# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Setup variables using grains['os_family'] based logic.
# You just need to add the key:values for an `os_family` that differ
# from `defaults.yaml`.
# Only add an `os_family` which is/will be supported by the formula
#
# If you do not need to provide defaults via the `os_family` grain,
# you will need to provide at least an empty dict in this file, e.g.
# osfamilymap: {}
---
{%- if grains.os == 'MacOS' %}
    {#- Populated by the custom grain in _grains/mongodb.py. #}
    {#- Run `salt '*' saltutil.sync_grains` once after pulling the formula. #}
    {%- set macos_rootuser = grains.get('mongodb_console_user', '') %}
    {%- set macos_rootgroup = grains.get('mongodb_console_group', '') %}
{%- endif %}

Arch:
  wanted:
    firewall: false
  pkg:
    deps:
      - tar
      - curl
      - openssl
    # No MongoDB Arch repo upstream; fall back to archive install for
    # the server components. Arch users with AUR can install
    # mongodb-bin / mongodb-tools-bin / mongosh-bin separately.
    database:
      mongod:
        use_upstream: 'archive'
      mongos:
        use_upstream: null
      dbtools:
        use_upstream: 'archive'

Alpine: {}

Debian:
  wanted:
    firewall: false
  pkg:
    deps:
      - curl
      - openssl
      - tar
      - unzip
      # Required for `python3 -m venv` - Debian ships venv as a
      # separate package; RHEL/Arch include it in python3 stdlib.
      - python3-venv
    repo:
      file: /etc/apt/sources.list.d/mongodb-org-REL.list
      # https://pgp.mongodb.com/ is MongoDB's current key host. The
      # previous keyserver-based approach used the old key fingerprint
      # served at www.mongodb.org which 301-redirects. Note: for
      # Ubuntu 24.04+ apt-key is removed entirely, which requires
      # `aptkey: false` + a signed-by= path baked into the sources
      # line. Not addressed here.
      key_url: https://pgp.mongodb.com/server-REL.asc
                 {%- if 'oscodename' in grains %}
      # `grains.os|lower` returns 'debian' or 'ubuntu' - both serve
      # separate paths under repo.mongodb.org/apt/. The component is
      # `main` on Debian, `multiverse` on Ubuntu.
      # yamllint disable-line rule:line-length
      name: deb [ arch=amd64,arm64 ] http://repo.mongodb.org/apt/{{ grains.os|lower }} {{ grains.oscodename }}/mongodb-org/REL {{ 'main' if grains.os in ('Debian',) else 'multiverse' }}
      # yamllint enable-line rule:line-length
                 {%- endif %}
    # mongod / mongos / dbtools `use_upstream: 'repo'` comes from
    # defaults.yaml - no per-Debian override needed.
    gui:
      compass:
        use_upstream: native
        native:
          source: https://downloads.mongodb.com/compass/mongodb-compass-community_VER_amd64.deb
          source_hash: 8101ae6c2294072090751c7226dd0ee0467f65217bf68886a9b8b6b1f3441bc8
          skip_verify: false

RedHat:
  wanted:
    firewall: false    # turned off for travis ci
    selinux: false     # turrned off for travs citrue
    default:
      user: mongod
      group: mongod
  pkg:
    deps:
      - libcurl
      - openssl
      - tar
      - unzip
      - {{ 'policycoreutils' if grains.osrelease|int >= 8 else 'policycoreutils-python' }}
      - selinux-policy-targeted
    repo:
      # yamllint disable-line rule:line-length
      baseurl: https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/REL/$basearch
      name: mongodb-org-REL
      humanname: MongoDB REL Repository
      # pgp.mongodb.com is MongoDB's current key host.
      # www.mongodb.org/static/pgp/ now 301-redirects here.
      gpgkey: https://pgp.mongodb.com/server-REL.asc
      from_repo_value: ''
    # mongod / mongos / dbtools `use_upstream: 'repo'` comes from
    # defaults.yaml. Amazon Linux is the exception: MongoDB's official
    # yum repo doesn't cover the amzn2/amzn2023 oscodes (server-amzn2
    # isn't published), so it falls back to archive.
    database:
      mongod:
        user: mongod
        group: mongod
          {%- if 'osfinger' in grains and 'amazon' in grains.osfinger|lower %}
        use_upstream: 'archive'
          {%- endif %}
          {%- if 'osfinger' in grains and 'amazon' in grains.osfinger|lower %}
      mongos:
        # archive sibling: mongos binary comes from mongod tarball
        use_upstream: null
      dbtools:
        use_upstream: 'archive'
          {%- endif %}
    gui:
      compass:
        use_upstream: native
        native:
          source: https://downloads.mongodb.com/compass/mongodb-compass-community-VER.ARCH.rpm
          source_hash: ee4ab84302710686e8bec0309c68de5ab49d85a77b60e244a63be3e0e93562ca
          skip_verify: false
    connectors:
      bi:
        user: mongod
        group: mongod

Suse: {}

Gentoo: {}

FreeBSD:
  identity:
    rootgroup: wheel

OpenBSD:
  identity:
    rootgroup: wheel
  kernel: openbsd

Solaris: {}

Windows:
  wanted:
    disable_transparent_hugepages: false
  dir:
    archive: C:\\Program Files\\MongoDB
  pkg:
    gui:
      robo3t:
        archive:
          source: https://download-test.robomongo.org/windows/robo3t-VER-windows-ARCH-7419c406.zip
          skip_verify: true

MacOS:
  wanted:
    disable_transparent_hugepages: false
  dir:
    default: /etc/defaults
    homes: /Users
  identity:
    user: {{ macos_rootuser | d('') }}
    rootuser: {{ macos_rootuser | d('') }}
    rootgroup: {{ macos_rootgroup | d('') }}
  pkg:
    deps:
      - curl
    # MongoDB doesn't publish an official macOS apt/yum repo; install
    # mongod / mongos / dbtools from the macOS archive instead.
    database:
      mongod:
        use_upstream: 'archive'
        service:
          name: org.mongo.mongodb.mongod
        archive:
          source: https://fastdl.mongodb.org/osx/mongodb-macos-ARCH-VER.tgz
          source_hash: https://fastdl.mongodb.org/osx/mongodb-macos-ARCH-VER.tgz.sha256
      mongos:
        # archive sibling: mongos binary comes from mongod tarball
        use_upstream: null
        service:
          name: org.mongo.mongodb.mongos
      dbtools:
        use_upstream: archive
        archive:
          source: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-macos-ARCH-VER.tgz
      shell:
        # mongosh is published only as .zip for darwin; Salt's
        # archive.extracted has no zip equivalent of --strip-components,
        # so the formula can't normalize the extraction layout.
        # Install via `brew install mongosh` instead.
        use_upstream: null
    gui:
      compass:
        name: MongoDB Compass Community
        use_upstream: macapp
        macapp:
          source: https://downloads.mongodb.com/compass/mongodb-compass-community-VER-darwin-x64.dmg
          source_hash: af2840d0a71a15d01160b547766cd291acc2f15955f1dee1ac79cc9db60153ba
          skip_verify: true
      robo3t:
        name: Robo 3T
        use_upstream: macapp
        macapp:
          source: https://download-test.robomongo.org/mac/robo3t-VER-darwin-ARCH-7419c40.dmg
          skip_verify: true
