# -*- coding: utf-8 -*-
# vim: ft=yaml
---
{% macro m(name, uri, oscode) %}
{{ uriname|default(name, true) }}:
  pkg:
    database:
      mongod:
        use_upstream: archive
        archive:
          source: https://fastdl.mongodb.org/linux/mongodb-linux-ARCH-{{ oscode }}-VER.tgz
          source_hash: https://fastdl.mongodb.org/linux/mongodb-linux-ARCH-{{ oscode }}-VER.tgz.sha256
        native:
          source: https://repo.mongodb.org/{{ uri|replace('COMP', 'mongodb-org-server') }}
          skip_verify: true
      dbtools:
        use_upstream: archive
        archive:
          source: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-{{ oscode }}-ARCH-VER.tgz  # noqa 204
          skip_verify: true
    connectors:
      bi:
        use_upstream: archive
        archive:
          source: https://info-mongodb-com.s3.amazonaws.com/mongodb-bi/v2/mongodb-bi-linux-ARCH-{{ oscode }}-vVER.tgz  # noqa 204
          source_hash: https://info-mongodb-com.s3.amazonaws.com/mongodb-bi/v2/mongodb-bi-linux-ARCH-{{ oscode }}-vVER.tgz.sha256  # noqa 204

{% endmacro %}

{# native sources: https://www.mongodb.com/download-center/community #}
{# RHEL family — same el<major> tarball serves RHEL / Rocky / Alma / CentOS Stream #}
{{ m('RedHat-8', 'yum/redhat/8/mongodb-org/REL/ARCH/RPMS/COMP-VER.el8.ARCH.rpm', 'rhel80') }}
{{ m('RedHat-9', 'yum/redhat/9/mongodb-org/REL/ARCH/RPMS/COMP-VER.el9.ARCH.rpm', 'rhel90') }}
{{ m('Rocky-8', 'yum/redhat/8/mongodb-org/REL/ARCH/RPMS/COMP-VER.el8.ARCH.rpm', 'rhel80') }}
{{ m('Rocky-9', 'yum/redhat/9/mongodb-org/REL/ARCH/RPMS/COMP-VER.el9.ARCH.rpm', 'rhel90') }}
{{ m('AlmaLinux-8', 'yum/redhat/8/mongodb-org/REL/ARCH/RPMS/COMP-VER.el8.ARCH.rpm', 'rhel80') }}
{{ m('AlmaLinux-9', 'yum/redhat/9/mongodb-org/REL/ARCH/RPMS/COMP-VER.el9.ARCH.rpm', 'rhel90') }}
{{ m('CentOS Stream-8', 'yum/redhat/8/mongodb-org/REL/ARCH/RPMS/COMP-VER.el8.ARCH.rpm', 'rhel80') }}
{{ m('CentOS Stream-9', 'yum/redhat/9/mongodb-org/REL/ARCH/RPMS/COMP-VER.el9.ARCH.rpm', 'rhel90') }}

{# Amazon Linux #}
{{ m('Amazon-2', 'yum/amazon/2/mongodb-org/REL/ARCH/RPMS/COMP-VER.amzn2.ARCH.rpm', 'amazon2') }}
{{ m('Amazon-2023', 'yum/amazon/2023/mongodb-org/REL/ARCH/RPMS/COMP-VER.amzn2023.ARCH.rpm', 'amazon2023') }}

{# openSUSE / SLES #}
{{ m('Leap-15', 'zypper/suse/15/mongodb-org/REL/ARCH/RPMS/COMP-VER.suse15.ARCH.rpm', 'suse15') }}

{# Debian #}
{{ m('Debian-11', 'apt/debian/dists/bullseye/mongodb-org/REL/main/binary-amd64/COMP_VER_amd64.deb', 'debian11') }}  # noqa 204
{{ m('Debian-12', 'apt/debian/dists/bookworm/mongodb-org/REL/main/binary-amd64/COMP_VER_amd64.deb', 'debian12') }}  # noqa 204

