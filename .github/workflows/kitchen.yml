# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# Kitchen matrix runs only on manual dispatch until the formula has been
# end-to-end verified on at least one platform under modern Salt + MongoDB
# 8.0 + mongosh. Once a platform is reliably green, add the appropriate
# `push` / `pull_request` triggers above.
name: Kitchen
'on':
  workflow_dispatch:
    inputs:
      instance:
        description: |
          Run a single matrix entry instead of all of them.
          Leave blank to run the full matrix.
        required: false
        default: ''

jobs:
  kitchen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance:
          - default-ubuntu-2204-master-py3
          - default-ubuntu-2404-master-py3
          - default-oraclelinux-8-master-py3
          - default-almalinux-8-master-py3
          - default-rockylinux-8-master-py3
        # Rolling-distro saltimages tags haven't been rebuilt since
        # mid-2024; mark them as experimental so failures don't fail the
        # workflow. Remove the flag if/when upstream resumes rebuilds.
        include:
          - instance: default-opensuse-tmbl-latest-master-py3
            experimental: true
          - instance: default-arch-base-latest-master-py3
            experimental: true
          - instance: default-gentoo-stage3-latest-master-py3
            experimental: true
          - instance: default-gentoo-stage3-systemd-master-py3
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
        if: >-
          github.event.inputs.instance == ''
          || github.event.inputs.instance == matrix.instance
      - uses: ruby/setup-ruby@v1
        if: >-
          github.event.inputs.instance == ''
          || github.event.inputs.instance == matrix.instance
        with:
          # `bundler-cache: true` installs the Bundler pinned in
          # Gemfile.lock (BUNDLED WITH 4.0.14), which requires
          # Ruby 3.1+ - bump together with that pin when it changes.
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: kitchen verify
        if: >-
          github.event.inputs.instance == ''
          || github.event.inputs.instance == matrix.instance
        run: bin/kitchen verify "${{ matrix.instance }}"
      - name: dump diagnostics on failure
        if: >-
          failure() && (
            github.event.inputs.instance == ''
            || github.event.inputs.instance == matrix.instance
          )
        run: |
          set +e
          echo "::group::kitchen diagnose --all"
          bin/kitchen diagnose --all "${{ matrix.instance }}" 2>&1 | tail -200
          echo "::endgroup::"

          echo "::group::.kitchen/logs"
          ls -la .kitchen/logs/ 2>&1
          for f in .kitchen/logs/*.log; do
            echo "----- $f -----"
            cat "$f" 2>&1
          done
          echo "::endgroup::"

          echo "::group::docker ps -a"
          docker ps -a
          echo "::endgroup::"

          # kitchen verify doesn't auto-destroy on failure, so the
          # container should still exist. Prefer one built from the
          # image kitchen just built; fall back to the most recent
          # container of any kind.
          img=$(docker images -q | head -1)
          cid=$(docker ps -a --filter "ancestor=$img" -q | head -1)
          [ -z "$cid" ] && cid=$(docker ps -a -q | head -1)
          if [ -n "$cid" ]; then
            echo "::group::docker logs $cid"
            docker logs "$cid" 2>&1 | tail -200
            echo "::endgroup::"

            echo "::group::systemctl + sshd state inside $cid"
            docker exec "$cid" systemctl --no-pager --failed 2>&1
            docker exec "$cid" systemctl --no-pager status sshd 2>&1
            docker exec "$cid" ss -tlnp 2>&1
            docker exec "$cid" ls -la /etc/ssh/ 2>&1
            docker exec "$cid" sh -c 'grep -vE "^\s*(#|$)" /etc/ssh/sshd_config' 2>&1
            echo "::endgroup::"

            echo "::group::journalctl + ssh log inside $cid"
            docker exec "$cid" journalctl --no-pager -n 200 2>&1
            docker exec "$cid" cat /var/log/secure 2>/dev/null \
              || docker exec "$cid" cat /var/log/auth.log 2>/dev/null \
              || echo "(no ssh-relevant log file)"
            echo "::endgroup::"

            echo "::group::os + package state inside $cid"
            docker exec "$cid" cat /etc/os-release 2>&1
            # dnf (RHEL family)
            docker exec "$cid" sh -c \
              'command -v dnf >/dev/null && dnf repolist --enabled' 2>&1 \
              | head -30 || true
            docker exec "$cid" sh -c \
              'command -v dnf >/dev/null && dnf provides "libcrypto.so.3()(64bit)"' \
              2>&1 | head -30 || true
            docker exec "$cid" sh -c \
              'command -v dnf >/dev/null && dnf search openssl 2>&1
               | grep -iE "openssl|crypto"' 2>&1 | head -30 || true
            # apt (Debian family)
            docker exec "$cid" sh -c \
              'command -v apt >/dev/null && apt list --installed 2>/dev/null
               | grep -iE "openssl|crypto"' 2>&1 | head -30 || true
            echo "::endgroup::"
          else
            echo "no container left to inspect"
          fi
