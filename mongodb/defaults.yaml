# -*- coding: utf-8 -*-
# vim: ft=yaml
---
mongodb:
  componentypes: ['database', 'gui', 'connectors']
  packagetypes: ['archive', 'package', 'repo', 'native']
  wanted:
    database:
      - mongod
    gui: []
    connectors: []
    firewall: false
    selinux: false
    disable_transparent_hugepages: true
  pkg:
    deps:
      - python-pip
      - gzip
      - unzip
      - tar
    pips:
      - pymongo
    # Python binary used to create the isolated venv for pkg.pips.
    # Default works on classic salt-minion installs where system
    # python3 is in PATH and is covered by OS deps. Onedir minions can
    # override to `/opt/saltstack/salt/bin/python`; minions using a
    # versioned-only python can set this to `python3.11` etc. if they
    # also manage that interpreter in pkg.deps or elsewhere.
    venv_python: python3
    repo:
      humanname: mongodb
      name: mongodb
      comments:
        - installed by salt
      enabled: 1
      gpgcheck: 1

    database:
      dbtools:
        version: 100.10.0
        name: mongodb-database-tools
        # MongoDB's official apt / yum repo is the primary path on
        # Linux. osfamilymap.yaml overrides to 'archive' for Amazon
        # Linux and macOS where the repo isn't published.
        use_upstream: 'repo'
        archive:
          skip_verify: true
        commands:
          - bsondump
          - mongoexport
          - mongoimport
          - mongostat
          - mongodump
          - mongofiles
          - mongorestore
          - mongotop
      shell:
        version: 2.3.0
        name: mongodb-mongosh
        use_upstream: 'archive'
        config_file: /etc/mongodb/mongoshrc.js
        archive:
          # mongosh uses Node.js arch naming (x64, not x86_64), so this
          # URL uses COMPASSARCH instead of ARCH. See osarchmap.yaml.
          # yamllint disable-line rule:line-length
          source: https://downloads.mongodb.com/compass/mongosh-VER-linux-COMPASSARCH.tgz
          skip_verify: true
        commands:
          - mongosh
      mongod:
        version: 8.0.20
        name: mongodb-org-server
        # MongoDB's official apt / yum repo is the primary path on
        # Linux. osfamilymap.yaml overrides to 'archive' for Amazon
        # Linux and macOS where the repo isn't published.
        use_upstream: 'repo'
        user: mongodb
        group: mongodb
        config_file: /etc/mongodb/mongod.conf
        native:
          # see osfingermap
          skip_verify: true
        archive:
          skip_verify: true
          source: https://fastdl.mongodb.org/linux/mongodb-linux-ARCH-debian12-VER.tgz
        config:
          # http://docs.mongodb.org/manual/reference/configuration-options
          storage:
            dbPath: /var/lib/mongodb/mongod
          systemLog:
            quiet: true
            traceAllExceptions: false
            path: /var/log/mongodb/mongod.log
            destination: file
            logAppend: true
          # replication:
          #   replSetName: "rs1"
          # sharding:
          #   clusterRole: shardsvr
          net:
            port: 27017
        environ_file: /etc/default/mongod.sh
        environ: {}
        service:
          name: mongod
        commands:
          - mongod
          - mongodump
          - mongorestore
          - mongoexport
          - mongoimport
          - mongostat
          - mongotop
          - bsondump
          - mongofiles
          - mongos
        firewall:
          ports:
            - tcp/27017
            - tcp/27018
            - tcp/27019
      mongos:
        version: 8.0.20
        name: mongodb-org-mongos
        # Repo install on Linux: mongos is a separate package
        # (mongodb-org-mongos). osfamilymap.yaml overrides to `null`
        # for Amazon and macOS where mongos comes bundled with mongod's
        # archive tarball instead.
        use_upstream: 'repo'
        user: mongos
        group: mongos
        config_file: /etc/mongodb/mongos.conf
        config:
          sharding:
            configDB: 'rs1/127.0.0.1:27018'
          systemLog:
            quiet: true
            traceAllExceptions: false
            path: /var/log/mongodb/mongos.log
        service:
          name: mongos
        firewall:
          ports:
            - tcp/9093
            # tcp/9094
    gui:
      compass:
        version: 1.21.2
        name: mongo-compass
        use_upstream: native
      robo3t:
        version: 1.3.1
        use_upstream: archive
        archive:
          # yamllint disable-line rule:line-length
          source: https://download-test.robomongo.org/linux/robo3t-VER-linux-ARCH-7419c406.tar.gz
          skip_verify: true
        commands:
          - robo3t

    connectors:
      bi:
        name: mongodb-bi
        version: 2.13.4
        use_upstream: archive
        archive:
          # for linux, see osfingermap; bi is unavailable for macos
          skip_verify: true
        service:
          name: mongosqld
        firewall:
          ports: tcp/29017
        commands:
          - mongodrdl
          - mongosqld
          - mongotranslate
      kafka:
        version: 1.1.0
        name: mongo-kafka
        use_upstream: archive
        archive:
          # yamllint disable-line rule:line-length
          source: https://github.com/mongodb/mongo-kafka/releases/download/rVER/mongodb-kafka-connect-mongodb-VER.zip
          skip_verify: true
      spark:
        version: 2.4.1
        name: mongo-spark
        use_upstream: archive
        archive:
          source: https://github.com/mongodb/mongo-spark/archive/rVER.tar.gz
          skip_verify: true

  # Just here for testing
  added_in_defaults: defaults_value
  winner: defaults

  identity:
    user: root
    rootuser: root
    rootgroup: root

  retry_option:
    # https://docs.saltstack.com/en/latest/ref/states/requisites.html#retrying-states
    attempts: 3
    until: true
    interval: 60
    splay: 10
  linux:
    altpriority: 0
  limits:
    soft: 2048
    hard: 4096

  dir:
    archive: /usr/local/mongodb
    macapp: /Applications
    native: /tmp/downloads
    default: /etc/default
    etc: /etc/mongodb
    homes: /home
    pid: /var/run/mongodb
    log: /var/log/mongodb
    service: /usr/lib/systemd/system
    symlink: /usr/local
    tmp: /tmp/downloads
    var: /var/lib/mongodb
    venv: /opt/mongodb-formula/venv
