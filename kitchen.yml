# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: mongodb
  salt_copy_filter:
    - .kitchen
    - .git

platforms:
  ## SALT `master`
  - name: ubuntu-2204-master-py3
    driver:
      image: saltimages/salt-master-py3:ubuntu-22.04
      run_command: /lib/systemd/systemd
  - name: opensuse-tmbl-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:opensuse-tumbleweed-latest
    # Workaround to avoid intermittent failures on `opensuse-tumbleweed`:
    # => SCP did not finish successfully (255):  (Net::SCP::Error)
    transport:
      max_ssh_sessions: 1
  - name: oraclelinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:oraclelinux-8
  - name: arch-base-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:arch-base-latest
  - name: gentoo-stage3-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-latest
      run_command: /sbin/init
  - name: gentoo-stage3-systemd-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-systemd
  - name: almalinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:almalinux-8
  - name: rockylinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:rockylinux-8
      # Kitchen transport workaround (not a MongoDB/Salt runtime
      # requirement - do not propagate to production-shaped tests):
      # the GHA Ubuntu host's apparmor profile for `unix-chkpwd`
      # strips its dac_override capability inside containers, which
      # makes every PAM account check fail on RHEL family (sshd,
      # sudo, etc.). Two-pronged workaround:
      # 1. Use root for the SSH transport (driver.username) and skip
      #    sudo in the provisioner/verifier - that removes the
      #    kitchen+sudo path that was hitting PAM on every command.
      # 2. UsePAM no in sshd, so sshd's own PAM stack doesn't run
      #    either.
      # This is also closer to how a real salt-minion converges - as
      # root, no sudo escalation - than the kitchen+sudo plumbing was.
      username: root
      provision_command:
        - dnf install -y openssh-server
        - ssh-keygen -A
        - sed -ri 's/^[#[:space:]]*UsePAM[[:space:]]+.*/UsePAM no/'
          /etc/ssh/sshd_config
        - grep -qE '^[[:space:]]*UsePAM[[:space:]]+no'
          /etc/ssh/sshd_config
          || echo 'UsePAM no' >> /etc/ssh/sshd_config
        - install -d -m 0700 -o root -g root /root/.ssh
        - systemctl enable sshd
    provisioner:
      sudo: false
    verifier:
      sudo: false

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - mongodb._mapdata
            - mongodb
      pillars:
        top.sls:
          base:
            '*':
              - mongodb
      pillars_from_files:
        mongodb.sls: test/salt/pillar/default.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
