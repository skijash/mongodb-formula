# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/

# Kitchen transport workaround (not a MongoDB/Salt runtime requirement -
# do not propagate to production-shaped tests): the GHA Ubuntu host's
# apparmor profile for `unix-chkpwd` strips its dac_override capability
# inside containers, which makes every PAM account check fail on RHEL
# family (sshd, sudo, etc.). Two-pronged workaround:
#   1. Use root for the SSH transport (driver.username) and skip sudo
#      in the provisioner/verifier - removes the kitchen+sudo path that
#      was hitting PAM on every command.
#   2. UsePAM no in sshd, so sshd's own PAM stack doesn't run either.
# Also closer to how a real salt-minion converges (as root, no sudo).
# `_anchors` is not a recognized test-kitchen key; it exists only so
# the anchors below are defined before being referenced in `platforms:`.
_anchors:
  rhel_driver: &rhel_driver
    username: root
    provision_command:
      # python3.11-libs: provides encodings/cp437.py, which `virtualenv`
      # needs to read its bundled wheel ZIPs when seeding setuptools/
      # pip into a new venv. Saltimage ships python3.11 without it.
      - dnf install -y openssh-server python3.11-libs
      - ssh-keygen -A
      - sed -ri 's/^[#[:space:]]*UsePAM[[:space:]]+.*/UsePAM no/'
        /etc/ssh/sshd_config
      - grep -qE '^[[:space:]]*UsePAM[[:space:]]+no'
        /etc/ssh/sshd_config
        || echo 'UsePAM no' >> /etc/ssh/sshd_config
      - install -d -m 0700 -o root -g root /root/.ssh
      # Root's shadow entry is locked by default on RHEL containers;
      # with UsePAM no, sshd's own account check refuses to log into
      # locked accounts even for pubkey auth. Set the shadow password
      # field to a non-`!`/`*` placeholder so the lock check passes
      # but no real password could ever match (literal "NP" is not a
      # valid crypt hash).
      - usermod -p 'NP' root
      # Belt-and-braces: disable password auth in sshd entirely, and
      # restrict root login to pubkey only. Combined with the invalid
      # shadow placeholder above, there's no usable password path.
      - echo 'PasswordAuthentication no' >> /etc/ssh/sshd_config
      - echo 'KbdInteractiveAuthentication no' >> /etc/ssh/sshd_config
      - echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config
      - systemctl enable sshd
  rhel_no_sudo: &rhel_no_sudo
    sudo: false
  # RHEL 8 saltimages (rocky/alma/oracle) ship python3.11 via salt's
  # own RPM deps but no `python3` alternative is set up. Point venv
  # creation at the right binary via a per-platform pillar overlay.
  rhel8_provisioner: &rhel8_provisioner
    sudo: false
    pillars_from_files:
      mongodb.sls: test/salt/pillar/rhel-8.sls

driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: mongodb
  salt_copy_filter:
    - .kitchen
    - .git

platforms:
  ## SALT `master`
  - name: ubuntu-2204-master-py3
    driver:
      image: saltimages/salt-master-py3:ubuntu-22.04
      run_command: /lib/systemd/systemd
  - name: ubuntu-2404-master-py3
    driver:
      image: saltimages/salt-master-py3:ubuntu-24.04
      run_command: /lib/systemd/systemd
  - name: opensuse-tmbl-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:opensuse-tumbleweed-latest
    # Workaround to avoid intermittent failures on `opensuse-tumbleweed`:
    # => SCP did not finish successfully (255):  (Net::SCP::Error)
    transport:
      max_ssh_sessions: 1
  - name: oraclelinux-8-master-py3
    driver:
      <<: *rhel_driver
      image: saltimages/salt-master-py3:oraclelinux-8
    provisioner: *rhel8_provisioner
    verifier: *rhel_no_sudo
  - name: arch-base-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:arch-base-latest
  - name: gentoo-stage3-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-latest
      run_command: /sbin/init
  - name: gentoo-stage3-systemd-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-systemd
  - name: almalinux-8-master-py3
    driver:
      <<: *rhel_driver
      image: saltimages/salt-master-py3:almalinux-8
    provisioner: *rhel8_provisioner
    verifier: *rhel_no_sudo
  - name: rockylinux-8-master-py3
    driver:
      <<: *rhel_driver
      image: saltimages/salt-master-py3:rockylinux-8
    provisioner: *rhel8_provisioner
    verifier: *rhel_no_sudo

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - mongodb._mapdata
            - mongodb
      pillars:
        top.sls:
          base:
            '*':
              - mongodb
      pillars_from_files:
        mongodb.sls: test/salt/pillar/default.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
