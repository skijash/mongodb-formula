# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: mongodb
  salt_copy_filter:
    - .kitchen
    - .git

platforms:
  ## SALT `master`
  - name: ubuntu-2204-master-py3
    driver:
      image: saltimages/salt-master-py3:ubuntu-22.04
      run_command: /lib/systemd/systemd
  - name: opensuse-tmbl-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:opensuse-tumbleweed-latest
    # Workaround to avoid intermittent failures on `opensuse-tumbleweed`:
    # => SCP did not finish successfully (255):  (Net::SCP::Error)
    transport:
      max_ssh_sessions: 1
  - name: oraclelinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:oraclelinux-8
  - name: arch-base-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:arch-base-latest
  - name: gentoo-stage3-latest-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-latest
      run_command: /sbin/init
  - name: gentoo-stage3-systemd-master-py3
    driver:
      image: saltimages/salt-master-py3:gentoo-stage3-systemd
  - name: almalinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:almalinux-8
  - name: rockylinux-8-master-py3
    driver:
      image: saltimages/salt-master-py3:rockylinux-8
      # The saltimage doesn't ship a usable kitchen environment:
      # - sshd's host keys aren't generated (sshd-keygen.service
      #   doesn't run reliably under systemd-in-Docker).
      # - The `kitchen` user is missing from /etc/passwd; PAM rejects
      #   pre-auth with "could not obtain user info (kitchen)".
      # Create everything the Ubuntu saltimage gets for free: install
      # + enable sshd, generate host keys, add the kitchen user, and
      # give it passwordless sudo (the salt_solo provisioner runs
      # `sudo -E salt-call ...`).
      provision_command:
        - dnf install -y openssh-server sudo
        - ssh-keygen -A
        - systemctl enable sshd
        - useradd -m -s /bin/bash kitchen
        - install -d -m 0700 -o kitchen -g kitchen /home/kitchen/.ssh
        - echo 'kitchen ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/kitchen
        - chmod 0440 /etc/sudoers.d/kitchen

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - mongodb._mapdata
            - mongodb
      pillars:
        top.sls:
          base:
            '*':
              - mongodb
      pillars_from_files:
        mongodb.sls: test/salt/pillar/default.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
