# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# Kitchen matrix runs only on manual dispatch until the formula has been
# end-to-end verified on at least one platform under modern Salt + MongoDB
# 8.0 + mongosh. Once a platform is reliably green, add the appropriate
# `push` / `pull_request` triggers above.
name: Kitchen
'on':
  workflow_dispatch:
    inputs:
      instance:
        description: |
          Run a single matrix entry instead of all of them.
          Leave blank to run the full matrix.
        required: false
        default: ''

jobs:
  kitchen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance:
          - default-ubuntu-2204-master-py3
          - default-oraclelinux-8-master-py3
          - default-almalinux-8-master-py3
          - default-rockylinux-8-master-py3
        # Rolling-distro saltimages tags haven't been rebuilt since
        # mid-2024; mark them as experimental so failures don't fail the
        # workflow. Remove the flag if/when upstream resumes rebuilds.
        include:
          - instance: default-opensuse-tmbl-latest-master-py3
            experimental: true
          - instance: default-arch-base-latest-master-py3
            experimental: true
          - instance: default-gentoo-stage3-latest-master-py3
            experimental: true
          - instance: default-gentoo-stage3-systemd-master-py3
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    if: >-
      github.event.inputs.instance == ''
      || github.event.inputs.instance == matrix.instance
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: kitchen verify
        run: bin/kitchen verify "${{ matrix.instance }}"
